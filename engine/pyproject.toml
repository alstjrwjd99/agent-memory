[project]
name = "agent-memory-engine"
version = "0.1.0"
description = "agent-memory 엔진: events → episode 승격, reflect, 승인, export"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
sdk = ["anthropic>=0.70"]

[project.scripts]
amem = "amem.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
